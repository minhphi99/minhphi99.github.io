<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <link rel="stylesheet" href="weatherapp.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
</head>

<body>
    <main class="container">
        <div class="input-container">
            <input class="input" type="text" placeholder="Enter your city">
            <span class="material-symbols-outlined">
                search
            </span>
        </div>
        <div class="location-date">
            <span class="location">Ha Noi</span>
            <span class="data">Mon 26/5</span>
        </div>
        <div class="icon-temp">
            <img alt="weather icon">
            <span class="temp">30</span>
        </div>
        <div class="humid-wind">
            <span class="humid">Humidity</span>
            <span class="wind">Wind speed</span>
        </div>
        <div class="forecast"></div>
    </main>
    <script src="weatherapp.js"></script>
</body>

</html>
